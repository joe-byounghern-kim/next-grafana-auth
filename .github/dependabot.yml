version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      lint-tooling:
        patterns:
          - eslint
          - "@eslint/js"
          - "@typescript-eslint/*"
        update-types:
          - minor
          - patch
      test-tooling:
        patterns:
          - vitest
          - jsdom
          - "@testing-library/*"
        update-types:
          - minor
          - patch
    ignore:
      # Unblock when typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Unblock when Node 20 is removed and supported Node 22 is >=22.22.2, or Node 22 support is dropped.
      - dependency-name: jsdom
        update-types:
          - version-update:semver-major
      # Unblock when Node 20 is removed from contributor CI.
      - dependency-name: "@testing-library/jest-dom"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
