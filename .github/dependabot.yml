version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      types:
        patterns:
          - "@types/*"
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
      lint-tooling:
        patterns:
          - eslint
          - "@eslint/js"
          - typescript-eslint
        update-types:
          - minor
          - patch
      test-tooling:
        patterns:
          - vitest
          - jsdom
          - "@testing-library/*"
        update-types:
          - minor
          - patch
    ignore:
      # Unblock when typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    labels:
      - dependencies

  - package-ecosystem: npm
    directories:
      - "/examples/basic"
      - "/examples/custom-session"
      - "/examples/nextauth"
      - "/sandbox"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      app-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      app-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - ci

  - package-ecosystem: docker
    directory: "/examples"
    schedule:
      interval: weekly
    groups:
      grafana:
        patterns:
          - grafana/grafana
        update-types:
          - minor
          - patch
    labels:
      - dependencies
