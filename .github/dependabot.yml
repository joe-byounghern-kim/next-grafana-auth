version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      lint-tooling:
        patterns:
          - eslint
          - "@eslint/js"
          - typescript-eslint
        update-types:
          - minor
          - patch
      test-tooling:
        patterns:
          - vitest
          - jsdom
          - "@testing-library/*"
        update-types:
          - minor
          - patch
    ignore:
      # Unblock when typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: "/examples/basic"
    schedule:
      interval: weekly
    groups:
      frontend-framework:
        patterns:
          - next
          - react
          - react-dom
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: "/examples/custom-session"
    schedule:
      interval: weekly
    groups:
      frontend-framework:
        patterns:
          - next
          - react
          - react-dom
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: "/examples/nextauth"
    schedule:
      interval: weekly
    groups:
      frontend-framework:
        patterns:
          - next
          - next-auth
          - react
          - react-dom
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: "/sandbox"
    schedule:
      interval: weekly
    groups:
      frontend-framework:
        patterns:
          - next
          - react
          - react-dom
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci

  - package-ecosystem: docker
    directory: "/examples"
    schedule:
      interval: weekly
    groups:
      grafana:
        patterns:
          - grafana/grafana
    labels:
      - dependencies
