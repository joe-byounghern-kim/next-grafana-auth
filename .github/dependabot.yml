version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      development-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Unblock when typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    labels:
      - dependencies

  - package-ecosystem: npm
    directories:
      - "/examples/basic"
      - "/examples/custom-session"
      - "/examples/nextauth"
      - "/sandbox"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      app-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      app-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - ci

  - package-ecosystem: docker
    directory: "/examples"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      grafana:
        patterns:
          - grafana/grafana
        update-types:
          - minor
          - patch
    labels:
      - dependencies
