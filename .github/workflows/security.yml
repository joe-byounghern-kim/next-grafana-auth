name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit repository-owned dependencies
        run: npm audit --audit-level=high --omit=peer

  example-audit:
    name: Example Audit (${{ matrix.app-dir }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app-dir:
          - examples/basic
          - examples/nextauth
          - examples/custom-session
          - sandbox

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ${{ matrix.app-dir }}/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.13.0

      - name: Install root dependencies
        run: npm ci

      - name: Build root package
        run: npm run build

      - name: Install app dependencies
        run: npm ci --prefix ${{ matrix.app-dir }}

      - name: Audit app runtime dependencies
        run: npm audit --prefix ${{ matrix.app-dir }} --audit-level=high --omit=dev

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
