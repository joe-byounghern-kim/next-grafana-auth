name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Dependency Audit (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.22.2', '24.15.0', '26.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Pin npm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm-12" npm@12.0.2
          echo "$RUNNER_TEMP/npm-12/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm-12/bin/npm" --version

      - name: Install dependencies
        run: npm ci

      - name: Audit repository-owned dependencies
        run: npm audit --audit-level=high

  example-audit:
    name: Example Audit (${{ matrix.app-dir }}, Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.22.2', '24.15.0', '26.x']
        app-dir:
          - examples/basic
          - examples/custom-session
          - examples/nextauth
          - sandbox

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ${{ matrix.app-dir }}/package-lock.json

      - name: Pin npm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm-12" npm@12.0.2
          echo "$RUNNER_TEMP/npm-12/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm-12/bin/npm" --version

      - name: Install root dependencies
        run: npm ci

      - name: Build root package
        run: npm run build

      - name: Install app dependencies
        run: npm ci --prefix "${{ matrix.app-dir }}"

      - name: Audit app dependencies
        run: npm audit --prefix "${{ matrix.app-dir }}" --audit-level=high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
