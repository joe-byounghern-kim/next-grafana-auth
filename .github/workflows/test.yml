name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['22.22.2', '24.15.0', '26.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Smoke component entry point
        run: npm run smoke:component

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-node-${{ matrix.node-version }}
          path: dist/
          retention-days: 7

  consumer-runtime-smoke:
    name: Consumer Runtime Smoke (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        node-version: ['18.18.0', '20.9.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download built package
        uses: actions/download-artifact@v8
        with:
          name: dist-node-22.22.2
          path: dist

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Smoke CommonJS and ESM entry points
        run: node scripts/smoke-built-package.mjs

  check-size:
    name: Check Bundle Size
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          set -euo pipefail
          size=$(gzip -c dist/index.mjs | wc -c)
          echo "ESM bundle size (gzip): ${size} bytes"
          if [ "$size" -gt 15360 ]; then
            echo "Bundle size exceeds 15KB limit: ${size} bytes"
            exit 1
          fi
          echo "Bundle size is within 15KB limit"

          total_size=$(du -sh dist | cut -f1)
          echo "Total dist size: ${total_size}"

      - name: List files
        run: ls -lah dist/

  examples-smoke:
    name: ${{ matrix.app-dir }} (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.22.2', '24.15.0', '26.x']
        app-dir:
          - examples/basic
          - examples/custom-session
          - examples/nextauth
          - sandbox

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ${{ matrix.app-dir }}/package-lock.json

      - name: Pin npm
        run: npm install --global npm@12.0.2

      - name: Install root dependencies
        run: npm ci

      - name: Build root package
        run: npm run build

      - name: Install app dependencies
        run: npm ci --prefix "${{ matrix.app-dir }}"

      - name: Build app
        run: npm run build --prefix "${{ matrix.app-dir }}"
        env:
          GRAFANA_INTERNAL_URL: http://localhost:3001
          NEXTAUTH_SECRET: sandbox-ci-secret
          NEXTAUTH_URL: http://localhost:3000

      - name: Verify documented startup
        if: matrix.app-dir != 'sandbox'
        run: JCODE_SCRATCH_DIR="$RUNNER_TEMP" scripts/verify-example-startup.sh "${{ matrix.app-dir }}"

      - name: Sandbox runtime smoke
        if: matrix.app-dir == 'sandbox' && matrix.node-version == '22.22.2'
        run: |
          set -euo pipefail
          cleanup() {
            docker compose \
              --project-directory examples \
              -f examples/docker-compose.yml \
              down -v >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker compose -f examples/docker-compose.yml config --quiet
          QUICK_START_VERIFY_ONLY=1 ./sandbox/quick-start.sh
