name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  validate:
    name: Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.22.2', '24.15.0', '26.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Pin npm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm-12" npm@12.0.2
          echo "$RUNNER_TEMP/npm-12/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm-12/bin/npm" --version

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Inspect package contents
        run: npm pack --dry-run

  publish:
    name: Publish to npm and create release
    runs-on: ubuntu-latest
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Pin npm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm-12" npm@12.0.2
          echo "$RUNNER_TEMP/npm-12/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm-12/bin/npm" --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version ($tag_version) does not match package version ($package_version)"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            See auto-generated notes above for release details.
