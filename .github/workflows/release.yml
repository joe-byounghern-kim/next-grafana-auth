name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  validate:
    name: Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.22.2', '24.15.0', '26.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Pin npm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm-12" npm@12.0.2
          echo "$RUNNER_TEMP/npm-12/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm-12/bin/npm" --version

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Check documentation links
        run: npm run docs:check

      - name: Build
        run: npm run build

      - name: Check package exports
        run: |
          npm run smoke:dist
          npm run smoke:component

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Inspect package contents
        run: npm pack --dry-run

  publish:
    name: Verify npm access and publish on tag push
    runs-on: ubuntu-latest
    needs: validate
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Pin npm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm-12" npm@12.0.2
          echo "$RUNNER_TEMP/npm-12/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm-12/bin/npm" --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version ($tag_version) does not match package version ($package_version)"
            exit 1
          fi

      - name: Check npm identity and package access
        run: |
          set -euo pipefail
          identity="$(npm whoami)"
          package_name="$(node -p "require('./package.json').name")"
          npm access list collaborators "$package_name" --json > "$RUNNER_TEMP/npm-package-access.json"
          node - "$RUNNER_TEMP/npm-package-access.json" "$identity" <<'NODE'
          const fs = require('node:fs')
          const permissions = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const name = require('./package.json').name
          if (permissions[process.argv[3]] !== 'read-write') {
            throw new Error(`npm identity does not have read-write access to ${name}`)
          }
          console.log(`npm identity has read-write access to ${name}`)
          NODE
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Preview publication without publishing
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --dry-run --access public

      - name: Publish to npm
        if: github.event_name == 'push'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGELOG.md
